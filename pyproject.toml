[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabexp"
version = "0.1.0"
description = "TabEXP: LLM-Guided Relational Table Learning via Task-Specific Exploration"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=14", "duckdb>=1.2", "torch>=2.5", "scikit-learn>=1.3", "catboost>=1.2", "PyYAML>=6"]

[project.optional-dependencies]
relbench = ["relbench>=3,<4"]

[project.scripts]
tabexp = "tabexp.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tabexp*"]
